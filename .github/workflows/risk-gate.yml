name: Risk Gate

on:
  pull_request:
  workflow_call:
    inputs:
      base-branch:
        type: string
        default: main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: risk-gate-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  assess:
    runs-on: ubuntu-latest

    env:
      BUILD_CONVENTION_PATH: ${{ github.workspace }}/build-convention
      RISK_GATE_PATH: ${{ github.workspace }}/.risk-gate

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Build Convention
        uses: actions/checkout@v4
        with:
          repository: dochiri0916/build-convention
          path: build-convention

      - name: Checkout Risk Gate
        uses: actions/checkout@v4
        with:
          repository: dochiri0916/risk-gate
          path: .risk-gate

      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ inputs.base-branch || 'main' }}
          EVENT_PATH: ${{ github.event_path }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .risk-gate/scripts/ci/pr_context.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Convention
        id: build
        shell: bash
        run: |
          set +e

          ./gradlew check \
            -PchangedCoverageBaseRef="origin/${{ steps.pr.outputs.BASE_REF }}"

          code=$?

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Semgrep
        id: semgrep
        shell: bash
        run: |
          python3 -m pip install semgrep

          mkdir -p build/reports/semgrep

          configs=(--config auto)

          if [[ -f .semgrep.yml ]]; then
            configs+=(--config .semgrep.yml)
          fi

          set +e

          semgrep scan \
            "${configs[@]}" \
            --exclude build-convention \
            --exclude .risk-gate \
            --exclude gradlew \
            --exclude gradlew.bat \
            --json \
            --output build/reports/semgrep/report.json \
            .

          code=$?

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Package Risk Gate
        working-directory: .risk-gate
        run: ./gradlew bootJar

      - name: Risk Gate
        env:
          BASE_REF: ${{ steps.pr.outputs.BASE_REF }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.HEAD_SHA }}
          PR_NUMBER: ${{ steps.pr.outputs.PR_NUMBER }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          SEMGREP_EXIT: ${{ steps.semgrep.outputs.exit_code }}
        run: python3 .risk-gate/scripts/ci/risk_gate.py

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-gate-reports
          if-no-files-found: warn
          path: |
            build/reports/build-convention/report.json
            build/reports/semgrep/report.json
            build/reports/risk-gate/response.json
