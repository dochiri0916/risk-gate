name: Risk Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    env:
      BUILD_CONVENTION_DIR: ${{ github.workspace }}/build-convention
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: dochiri0916/build-convention
          path: build-convention
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Convention
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew check -PchangedCoverageBaseRef="origin/${{ github.base_ref }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Semgrep
        id: semgrep
        shell: bash
        run: |
          python3 -m pip install semgrep
          mkdir -p build/reports/semgrep
          set +e
          semgrep scan --config auto --exclude build-convention --json --output build/reports/semgrep/report.json .
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package Risk Gate
        run: ./gradlew bootJar
      - name: Risk Gate
        env:
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          SEMGREP_EXIT: ${{ steps.semgrep.outputs.exit_code }}
        run: python3 scripts/ci/risk_gate.py
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-gate-reports
          if-no-files-found: warn
          path: |
            build/reports/build-convention/report.json
            build/reports/semgrep/report.json
            build/reports/risk-gate/response.json
